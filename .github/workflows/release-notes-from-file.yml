name: Release with Notes

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Use .NET SDK for RX Softphone
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: rx-softphone-desktop/global.json

      - name: Install and validate locked dependencies
        run: |
          npm ci
          npm audit --audit-level=high
          npm run check:public-js

      - name: Build Windows release package
        run: npm run build:exe

      - name: Build RX Softphone workstation package
        shell: pwsh
        run: |
          .\rx-softphone-desktop\build-release.ps1
          if ($LASTEXITCODE -ne 0) { throw 'RX Softphone release build failed.' }
          $softphone = Get-ChildItem -LiteralPath rx-softphone-desktop\release -Filter 'RxSoftphone-*-win-x64.zip' -File
          if ($softphone.Count -ne 1) { throw "Expected exactly one RX Softphone ZIP; found $($softphone.Count)." }
          Copy-Item -LiteralPath $softphone[0].FullName -Destination (Join-Path 'dist' $softphone[0].Name) -Force

      - name: Verify executables and create checksums
        shell: pwsh
        run: |
          .\dist\server.exe --v
          if ($LASTEXITCODE -ne 0) { throw 'server.exe version check failed.' }
          .\dist\rx-db.exe help
          if ($LASTEXITCODE -ne 0) { throw 'rx-db.exe help check failed.' }
          $files = Get-ChildItem dist\server.exe, dist\rx-db.exe, dist\server-update-*.zip, dist\RxSoftphone-*-win-x64.zip
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          $lines | Set-Content dist\SHA256SUMS.txt -Encoding utf8

      - name: Resolve release notes file
        id: release_notes
        shell: pwsh
        run: |
          $tagNotes = ".github/releases/$env:GITHUB_REF_NAME.md"
          $defaultNotes = '.github/RELEASE_NOTES.md'
          if (Test-Path -LiteralPath $tagNotes) {
            $bodyFile = $tagNotes
          } elseif (Test-Path -LiteralPath $defaultNotes) {
            $bodyFile = $defaultNotes
          } else {
            $bodyFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            @(
              '## Release Notes',
              'Auto-generated release body unavailable. Add notes at `.github/releases/<tag>.md`',
              'or update `.github/RELEASE_NOTES.md`.'
            ) | Set-Content -LiteralPath $bodyFile -Encoding utf8
          }
          "body_file=$bodyFile" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.body_file }}
          prerelease: ${{ contains(github.ref_name, '-next.') }}
          fail_on_unmatched_files: true
          files: |
            dist/server-update-*.zip
            dist/RxSoftphone-*-win-x64.zip
            dist/SHA256SUMS.txt
