name: Release with Notes

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify release version and passed lifecycle gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$packageVersion") {
            throw "Release tag $tag does not match package version v$packageVersion."
          }

          $sha = (git rev-parse HEAD).Trim()
          $endpoint = "repos/$env:GITHUB_REPOSITORY/actions/workflows/database-lifecycle-ci.yml/runs?head_sha=$sha&status=success&event=push&per_page=100"
          $runs = gh api $endpoint | ConvertFrom-Json
          $passedMainRun = $runs.workflow_runs |
            Where-Object {
              $_.head_sha -eq $sha -and
              $_.head_branch -eq 'main' -and
              $_.conclusion -eq 'success'
            } |
            Select-Object -First 1
          if (-not $passedMainRun) {
            throw "No successful NEXT database lifecycle CI push run exists for main commit $sha. Push main, wait for lifecycle CI to pass, then create the release tag."
          }
          Write-Host "Lifecycle gate passed: $($passedMainRun.html_url)"

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Use .NET SDK for RX Softphone
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: rx-softphone-desktop/global.json

      - name: Install and validate locked dependencies
        run: |
          npm ci
          npm audit --audit-level=high
          npm run check:public-js

      - name: Build Windows release package
        run: npm run build:exe

      - name: Build RX Softphone workstation package
        shell: pwsh
        run: |
          .\rx-softphone-desktop\build-release.ps1
          if ($LASTEXITCODE -ne 0) { throw 'RX Softphone release build failed.' }
          $softphone = Get-ChildItem -LiteralPath rx-softphone-desktop\release -Filter 'RxSoftphone-*-win-x64.zip' -File
          if ($softphone.Count -ne 1) { throw "Expected exactly one RX Softphone ZIP; found $($softphone.Count)." }
          Copy-Item -LiteralPath $softphone[0].FullName -Destination (Join-Path 'dist' $softphone[0].Name) -Force

      - name: Verify executables and create checksums
        shell: pwsh
        run: |
          .\dist\server.exe --v
          if ($LASTEXITCODE -ne 0) { throw 'server.exe version check failed.' }
          .\dist\rx-db.exe help
          if ($LASTEXITCODE -ne 0) { throw 'rx-db.exe help check failed.' }
          $files = Get-ChildItem dist\server.exe, dist\rx-db.exe, dist\server-update-*.zip, dist\RX-Tracker-NEXT-New-Server-*.zip, dist\RxSoftphone-*-win-x64.zip
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          $lines | Set-Content dist\SHA256SUMS.txt -Encoding utf8

      - name: Resolve release notes file
        id: release_notes
        shell: pwsh
        run: |
          $tagNotes = ".github/releases/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $tagNotes)) {
            throw "Missing required version-specific release notes: $tagNotes"
          }
          $notes = Get-Content -LiteralPath $tagNotes -Raw
          if ($notes -notmatch [regex]::Escape($env:GITHUB_REF_NAME.TrimStart('v'))) {
            throw "Release notes do not identify version $env:GITHUB_REF_NAME."
          }
          "body_file=$tagNotes" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.body_file }}
          prerelease: ${{ contains(github.ref_name, '-next.') }}
          fail_on_unmatched_files: true
          files: |
            dist/server-update-*.zip
            dist/RX-Tracker-NEXT-New-Server-*.zip
            dist/RxSoftphone-*-win-x64.zip
            dist/SHA256SUMS.txt
