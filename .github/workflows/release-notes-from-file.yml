name: Release with Notes

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release notes file
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG_NOTES=".github/releases/${TAG}.md"
          DEFAULT_NOTES=".github/RELEASE_NOTES.md"

          if [ -f "$TAG_NOTES" ]; then
            BODY_FILE="$TAG_NOTES"
          elif [ -f "$DEFAULT_NOTES" ]; then
            BODY_FILE="$DEFAULT_NOTES"
          else
            BODY_FILE="/tmp/release-notes.md"
            printf '%s\n' \
              "## Release Notes" \
              "Auto-generated release body unavailable. Add notes file at \`.github/releases/<tag>.md\`" \
              "or update \`.github/RELEASE_NOTES.md\`." \
              > "$BODY_FILE"
          fi

          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.body_file }}
          fail_on_unmatched_files: false
