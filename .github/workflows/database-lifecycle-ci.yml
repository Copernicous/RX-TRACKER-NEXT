name: NEXT database lifecycle CI

on:
  push:
    branches: [main, develop, staging, modernize/database-lifecycle]
  pull_request:
    branches: [main, develop, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  softphone-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use .NET SDK for RX Softphone
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: rx-softphone-desktop/global.json

      - name: Compile RX Softphone
        shell: pwsh
        run: |
          dotnet restore .\rx-softphone-desktop\RxSoftphone.csproj -r win-x64
          dotnet build .\rx-softphone-desktop\RxSoftphone.csproj -c Release -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'RX Softphone compilation failed.' }

  database-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rx_next_ci_base_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: rx_next_ci_base_test
      PGPASSWORD: postgres
      JWT_SECRET: rx-next-ci-jwt-secret-with-more-than-32-characters
      SETTINGS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SOFTPHONE_CREDENTIAL_KEY: rx-next-ci-softphone-credential-key
      SOFTPHONE_RELAY_SECRET: rx-next-ci-relay-secret
      APP_ORIGINS: http://127.0.0.1:3211
      BACKUP_SCHEDULER_ENABLED: "false"
      SITE_BACKUP_SCHEDULER_ENABLED: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Use PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency and JavaScript checks
        run: |
          npm audit --audit-level=high
          npm run check:public-js
          pwsh -NoProfile -File scripts/Invoke-NextProduction.ps1 -Action Help
          pwsh -NoProfile -File scripts/Invoke-NextProduction.ps1 -Action SelfTest
          pwsh -NoProfile -File scripts/Invoke-ReleaseUpdate.ps1 -Action Help
          pwsh -NoProfile -File scripts/Invoke-ReleaseUpdate.ps1 -Action SelfTest
          pwsh -NoProfile -File scripts/Invoke-TestCopyRestore.ps1 -Action SelfTest
          npm run test:dependency-policy
          npm run test:security-automation
          npm run test:reference-data
          npm run test:new-server-installer
          npm run test:project-control-test-copy
          npm run test:report-view-render
          npm run test:delivery-log-archive
          npm run test:delivery-log-archive-client
          npm run test:routine-db-health
          npm run test:backup-scheduler-disable
          npm run test:backoffice-backup-snapshot
          npm run test:i18n-branding

      - name: Provision and verify a fresh database
        run: |
          npm run db:provision
          npm run db:status
          npm run db:verify
          npm run db:migrate

      - name: Validate newest backup through an isolated restore
        run: BACKUP_RECOVERABILITY_REAL_DB=true npm run test:backup-recoverability-integration

      - name: Verify migration checksum drift protection
        run: |
          createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -T rx_next_ci_base_test rx_next_ci_ledger_test
          DB_NAME=rx_next_ci_ledger_test npm run test:migration-checksums

      - name: Verify atomic test-data sanitization
        run: |
          createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -T rx_next_ci_base_test rx_next_ci_sanitizer_test
          DB_NAME=rx_next_ci_sanitizer_test npm run test:db-sanitizer
          DB_NAME=rx_next_ci_sanitizer_test npm run db:sanitize:verify

      - name: Rehearse v3.3.1 dump adoption
        run: |
          createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -T rx_next_ci_base_test rx_next_ci_v331_copy
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d rx_next_ci_v331_copy -v ON_ERROR_STOP=1 -c 'DROP TABLE "SequelizeMeta";'
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d rx_next_ci_v331_copy -v ON_ERROR_STOP=1 -c 'DROP INDEX "idx_users_username";'
          pg_dump -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -Fc -f /tmp/rx-next-v331.dump rx_next_ci_v331_copy
          createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -T template0 rx_next_ci_restore_rehearsal
          DB_NAME=rx_next_ci_restore_rehearsal npm run db:rehearse:v331 -- --dump /tmp/rx-next-v331.dump --confirm-database rx_next_ci_restore_rehearsal
          DB_NAME=rx_next_ci_restore_rehearsal npm run db:verify
          DB_NAME=rx_next_ci_restore_rehearsal npm run db:sanitize:verify

      - name: Run application regressions
        run: |
          createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -T rx_next_ci_base_test rx_next_ci_regression_test
          export DB_NAME=rx_next_ci_regression_test
          timeout --foreground 180s npm run test:call-center-queue-reopen
          timeout --foreground 180s npm run test:call-center-phone-client
          timeout --foreground 180s npm run test:call-center-shared-state
          SOFTPHONE_SETUP_TEST_DB_NAME=rx_next_ci_regression_test timeout --foreground 180s npm run test:softphone-self-setup
          CALL_ATTEMPT_TEST_DB_NAME=rx_next_ci_regression_test timeout --foreground 180s npm run test:call-center-call-attempts
          CALL_CENTER_PAGINATION_TEST_DB_NAME=rx_next_ci_regression_test timeout --foreground 180s npm run test:call-center-pagination
          PATIENT_PAGINATION_TEST_DB_NAME=rx_next_ci_regression_test PATIENT_PAGINATION_TEST_CONFIRM_DB_NAME=rx_next_ci_regression_test timeout --foreground 180s npm run test:patient-pagination
          REPORT_FILTER_TEST_DB_NAME=rx_next_ci_regression_test timeout --foreground 180s npm run test:report-filter-parity
          DASHBOARD_ANALYTICS_TEST_DB_NAME=rx_next_ci_regression_test DASHBOARD_ANALYTICS_TEST_CONFIRM_DB_NAME=rx_next_ci_regression_test timeout --foreground 180s npm run test:dashboard-analytics
          RX_PIPELINE_FILTER_TEST_DB_NAME=rx_next_ci_regression_test RX_PIPELINE_FILTER_TEST_CONFIRM_DB_NAME=rx_next_ci_regression_test timeout --foreground 180s npm run test:rx-pipeline-filter-parity
          timeout --foreground 180s npm run test:patient-double-update
          QA_DB_NAME=rx_next_ci_regression_test timeout --foreground 180s npm run test:rx-override
          timeout --foreground 180s npm run test:workflow-date
          timeout --foreground 180s npm run test:backoffice-patient-delete
          timeout --foreground 180s npm run test:service-window

      - name: Run RX driver-history regression
        run: |
          createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -T rx_next_ci_base_test rx_next_ci_driver_test
          QA_DB_NAME=rx_next_ci_driver_test timeout --foreground 180s npm run test:rx-driver-tracking
          DB_NAME=rx_next_ci_driver_test timeout --foreground 180s npm run test:pharmacy-transport-duplicates

      - name: Run managed RX Softphone relay integration
        shell: bash
        run: |
          export DB_NAME=rx_next_ci_regression_test
          export RELAY_TEST_DB_NAME=rx_next_ci_regression_test
          export RELAY_TEST_PORT=3212
          export PORT=3212
          export APP_ORIGINS=http://127.0.0.1:3212
          node app.js > /tmp/rx-next-relay-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3212/api/healthz > /tmp/rx-next-relay-health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/rx-next-relay-health.json
          npm run test:softphone-relay
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

      - name: Prove web runtime works with a restricted read-write database role
        shell: bash
        run: |
          export RX_RUNTIME_DB_PASSWORD='runtime-ci-password-2026'
          npm run db:runtime-role:configure -- --role rxnext_runtime_ci --confirm-database rx_next_ci_base_test
          npm run db:runtime-role:inspect -- --role rxnext_runtime_ci
          npm run db:runtime-role:verify -- --role rxnext_runtime_ci
          ROUTINE_DB_HEALTH_REAL_DB=true DB_NAME=rx_next_ci_base_test DB_USER=rxnext_runtime_ci DB_PASS="$RX_RUNTIME_DB_PASSWORD" timeout --foreground 180s npm run test:routine-db-health

          DB_NAME=rx_next_ci_base_test DB_USER=rxnext_runtime_ci DB_PASS="$RX_RUNTIME_DB_PASSWORD" PORT=3211 node app.js > /tmp/rx-next-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3211/api/healthz > /tmp/rx-next-health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/rx-next-health.json
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT
