<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Call Center ready through the RX Softphone relay</title>
  <desc id="desc">A Call Center screen reference with the green relay-ready badge and a patient row with a green phone icon.</desc>
  <style>.top{font:700 25px 'Segoe UI',Arial;fill:#e9f2ff}.nav{font:17px 'Segoe UI',Arial;fill:#b8c5d8}.h{font:700 20px 'Segoe UI',Arial;fill:#172033}.sub{font:15px 'Segoe UI',Arial;fill:#66758c}.head{font:700 13px 'Segoe UI',Arial;fill:#5b6d87}.cell{font:16px 'Segoe UI',Arial;fill:#1e293b}.name{font:700 17px 'Segoe UI',Arial;fill:#172033}.pill{font:700 14px 'Segoe UI',Arial;fill:#07613e}.white{font:700 16px 'Segoe UI',Arial;fill:white}.small{font:14px 'Segoe UI',Arial;fill:#65758b}</style>
  <rect width="1400" height="650" rx="24" fill="#eef3f8"/>
  <rect x="0" y="0" width="1400" height="78" rx="24" fill="#111d31"/><text x="42" y="49" class="top">Patient RX</text><text x="230" y="49" class="nav">Call Center</text><text x="1110" y="49" class="nav">Employee session in Kasm</text>
  <rect x="40" y="105" width="1320" height="440" rx="18" fill="white" stroke="#d6deea"/>
  <text x="70" y="149" class="h">▦ New Call Queue</text><text x="70" y="177" class="sub">Patients ready for the next call.</text>
  <rect x="1020" y="124" width="285" height="44" rx="22" fill="#e5f8ed" stroke="#4fba7c"/><circle cx="1047" cy="146" r="9" fill="#22c55e"/><text x="1067" y="151" class="pill">RX Softphone ready via relay</text>

  <rect x="40" y="205" width="1320" height="52" fill="#f1f5f9"/>
  <text x="70" y="237" class="head">FIRST / LAST</text><text x="315" y="237" class="head">CLINIC / LOCATION</text><text x="590" y="237" class="head">PATIENT TRANSPORT</text><text x="835" y="237" class="head">PHONE</text><text x="1070" y="237" class="head">CALL STATUS</text><text x="1290" y="237" class="head">SAVE</text>
  <rect x="40" y="257" width="1320" height="138" fill="#e9f7f0"/>
  <rect x="40" y="257" width="6" height="138" fill="#22c55e"/>
  <text x="70" y="305" class="name">OLIVIA BENNETT</text><text x="315" y="305" class="cell">Bayside Family Clinic</text><text x="590" y="305" class="cell">CareRide Patient Transport</text><text x="835" y="305" class="cell">305-321-3804</text>
  <circle cx="982" cy="299" r="27" fill="#14905c"/><path d="M971 288 C967 296 978 310 987 312 L993 305 L986 299 L981 303 C977 300 974 296 975 292 L982 289 L978 282 Z" fill="white"/>
  <rect x="1070" y="279" width="140" height="34" rx="17" fill="#dcfce7"/><text x="1091" y="301" class="pill">Ready to call</text>
  <rect x="1277" y="278" width="48" height="42" rx="10" fill="#22b66f"/><text x="1293" y="306" class="white">▣</text>
  <text x="70" y="360" class="small">Clicking this phone sends a relay command to the physical Windows PC. No xdg-open or MicroSIP dialog should appear.</text>

  <rect x="70" y="430" width="1235" height="76" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="95" y="460" class="cell">After the test: confirm dialing, ringing, answered/end timestamps, outcome, SIP result, ring duration and conversation duration.</text>
  <text x="95" y="489" class="small">Only an answered attempt automatically marks the patient Called. Save is for a note or service date.</text>
  <text x="40" y="605" class="small">Screen reference • Expected Kasm Call Center state</text>
</svg>
