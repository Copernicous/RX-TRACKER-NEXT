<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">RX Tracker phone account setup screen</title>
  <desc id="desc">A reference form showing the public PBX, SIP port, extension, display name, password, confirmation, local SIP port and supported codecs.</desc>
  <style>.h1{font:700 30px 'Segoe UI',Arial;fill:#f8fafc}.sub{font:16px 'Segoe UI',Arial;fill:#9fb0c7}.lab{font:700 14px 'Segoe UI',Arial;fill:#bfd0e6;letter-spacing:1px}.val{font:18px 'Segoe UI',Arial;fill:#eaf3ff}.small{font:14px 'Segoe UI',Arial;fill:#9fb0c7}.badge{font:700 13px 'Segoe UI',Arial;fill:#dbeafe}.btn{font:700 17px 'Segoe UI',Arial;fill:white}</style>
  <rect width="1200" height="760" rx="24" fill="#081321"/>
  <rect x="55" y="40" width="1090" height="670" rx="20" fill="#0f1d2e" stroke="#28415f"/>
  <text x="90" y="92" class="h1">Phone Account Setup</text>
  <text x="90" y="123" class="sub">Server-managed assignment for the current RX Tracker user</text>

  <text x="90" y="174" class="lab">SIP SERVER / PBX</text><rect x="90" y="190" width="650" height="54" rx="10" fill="#13263b" stroke="#3b5a78"/><text x="110" y="224" class="val">73.1.206.88</text>
  <text x="775" y="174" class="lab">SIP PORT</text><rect x="775" y="190" width="280" height="54" rx="10" fill="#13263b" stroke="#3b5a78"/><text x="795" y="224" class="val">5060</text>

  <text x="90" y="282" class="lab">EXTENSION / USERNAME</text><rect x="90" y="298" width="465" height="54" rx="10" fill="#13263b" stroke="#3b5a78"/><text x="110" y="332" class="val">1006</text>
  <text x="590" y="282" class="lab">DISPLAY NAME</text><rect x="590" y="298" width="465" height="54" rx="10" fill="#13263b" stroke="#3b5a78"/><text x="610" y="332" class="val">1006</text>

  <text x="90" y="390" class="lab">SIP PASSWORD</text><rect x="90" y="406" width="465" height="54" rx="10" fill="#13263b" stroke="#3b5a78"/><text x="110" y="440" class="val">••••••••••••••••</text>
  <text x="590" y="390" class="lab">CONFIRM SIP PASSWORD</text><rect x="590" y="406" width="465" height="54" rx="10" fill="#13263b" stroke="#3b5a78"/><text x="610" y="440" class="val">••••••••••••••••</text>

  <text x="90" y="498" class="lab">LOCAL SIP PORT</text><rect x="90" y="514" width="300" height="54" rx="10" fill="#13263b" stroke="#3b5a78"/><text x="110" y="548" class="val">0</text><text x="90" y="593" class="small">Use 0 for automatic port selection.</text>

  <text x="90" y="633" class="lab">SUPPORTED AUDIO CODECS</text>
  <rect x="90" y="649" width="170" height="31" rx="15" fill="#243b55"/><text x="106" y="670" class="badge">G.711 μ-law (PCMU)</text>
  <rect x="272" y="649" width="168" height="31" rx="15" fill="#243b55"/><text x="288" y="670" class="badge">G.711 A-law (PCMA)</text>
  <rect x="452" y="649" width="74" height="31" rx="15" fill="#243b55"/><text x="470" y="670" class="badge">G.722</text>
  <rect x="538" y="649" width="74" height="31" rx="15" fill="#243b55"/><text x="556" y="670" class="badge">G.729</text>
  <rect x="860" y="620" width="195" height="60" rx="12" fill="#2563eb"/><text x="913" y="657" class="btn">Save account</text>
  <text x="55" y="738" class="small">Screen reference • Enter the SIP password only in RX Tracker; never place it in documentation.</text>
</svg>
