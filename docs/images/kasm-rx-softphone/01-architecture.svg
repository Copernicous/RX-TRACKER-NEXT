<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Kasm and RX Softphone relay architecture</title>
  <desc id="desc">The Kasm browser operates RX Tracker while the physical Windows softphone polls a restricted HTTPS relay and connects directly to public Asterisk for SIP and audio.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/></marker>
    <style>
      .title{font:700 34px 'Segoe UI',Arial;fill:#e5eefb}.subtitle{font:18px 'Segoe UI',Arial;fill:#9fb0c7}.boxTitle{font:700 22px 'Segoe UI',Arial;fill:#f8fafc}.label{font:17px 'Segoe UI',Arial;fill:#d5e2f3}.small{font:15px 'Segoe UI',Arial;fill:#9fb0c7}.pill{font:700 14px 'Segoe UI',Arial;fill:#052e16}.mono{font:15px Consolas,monospace;fill:#bae6fd}.tinyMono{font:13px Consolas,monospace;fill:#bae6fd}
    </style>
  </defs>
  <rect width="1400" height="780" rx="24" fill="#07111f"/>
  <text x="55" y="64" class="title">How remote calling works</text>
  <text x="55" y="96" class="subtitle">The browser controls the call; the physical Windows PC owns SIP and audio.</text>

  <rect x="55" y="145" width="360" height="245" rx="20" fill="#10233d" stroke="#2563eb" stroke-width="2"/>
  <text x="85" y="188" class="boxTitle">Kasm browser session</text>
  <text x="85" y="228" class="label">portal.rbandrc.com</text>
  <rect x="85" y="252" width="300" height="56" rx="12" fill="#152e4d"/>
  <text x="105" y="287" class="label">RX Tracker Call Center</text>
  <text x="85" y="342" class="small">Temporary Kasm sessions are OK.</text>
  <text x="85" y="365" class="small">Pairing is not stored in this browser.</text>

  <rect x="500" y="145" width="320" height="245" rx="20" fill="#10233d" stroke="#06b6d4" stroke-width="2"/>
  <text x="530" y="188" class="boxTitle">RX Tracker server</text>
  <text x="530" y="226" class="mono">192.168.60.21:3000</text>
  <text x="530" y="268" class="label">Users and phone accounts</text>
  <text x="530" y="302" class="label">Pairing and call commands</text>
  <text x="530" y="336" class="label">Call status and analytics</text>

  <rect x="1000" y="145" width="345" height="245" rx="20" fill="#10233d" stroke="#f59e0b" stroke-width="2"/>
  <text x="1030" y="188" class="boxTitle">Physical Windows PC</text>
  <text x="1030" y="228" class="label">RxSoftphone.exe</text>
  <text x="1030" y="263" class="mono">127.0.0.1:5188</text>
  <rect x="1030" y="292" width="143" height="35" rx="18" fill="#bbf7d0"/>
  <text x="1050" y="315" class="pill">RELAY ONLINE</text>
  <rect x="1185" y="292" width="130" height="35" rx="18" fill="#bbf7d0"/>
  <text x="1207" y="315" class="pill">REGISTERED</text>
  <text x="1030" y="365" class="small">Microphone, speaker and SIP live here.</text>

  <path d="M415 225 C455 225 465 225 500 225" stroke="#38bdf8" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="421" y="207" class="small">normal app traffic</text>

  <path d="M1000 250 C950 250 900 250 820 250" stroke="#38bdf8" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="910" y="218" text-anchor="middle" class="small">outbound HTTPS 443</text>
  <text x="910" y="276" text-anchor="middle" class="tinyMono">rx-relay.rbandrc.com</text>

  <rect x="210" y="505" width="395" height="165" rx="20" fill="#0d2c24" stroke="#22c55e" stroke-width="2"/>
  <text x="240" y="548" class="boxTitle">Public Asterisk PBX</text>
  <text x="240" y="586" class="mono">73.1.206.88:5060/UDP</text>
  <text x="240" y="622" class="label">SIP registration + RTP audio</text>

  <path d="M1080 390 C1040 510 790 585 605 585" stroke="#22c55e" stroke-width="5" fill="none" marker-end="url(#greenArrow)"/>
  <text x="735" y="530" class="label">Direct SIP/RTP — not through Cloudflare or Kasm</text>

  <rect x="760" y="610" width="585" height="82" rx="16" fill="#241d0d" stroke="#f59e0b"/>
  <text x="790" y="643" class="label">Relay carries commands, status and managed account data only.</text>
  <text x="790" y="672" class="small">It never carries the conversation audio or SIP registration.</text>
  <text x="55" y="742" class="small">Screen reference • Current production topology • July 2026</text>
</svg>
